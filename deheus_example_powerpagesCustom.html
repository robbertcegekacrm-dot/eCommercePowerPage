<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De Heus Customer Portal (Power Pages standard components demo)</title>
<!--
  ============================================================
  POWER PAGES - STANDARD COMPONENT DEMO - DE HEUS (SINGLE FILE)
  Languages: English (default), Dutch, Czech.
  ============================================================
  Purpose: Shows what a De Heus order portal looks like when it is
  built mostly from default Power Pages building blocks:
    - Header / footer (web templates)
    - Sections and columns (design studio)
    - Lists (Dataverse views with search, filter, sort, paging)
    - Forms (Dataverse forms, read-only forms and subgrids)
    - Alerts, breadcrumb and success messages
  The few custom parts (live price lookup, cart) are marked as
  custom code. Use the "Show Power Pages components" button in the
  bottom left to see which parts are standard, configured or custom.

  Styling follows the Bootstrap look of the default Power Pages
  theme: only the theme colours (:root) are customised.
  Replace the "DH" monogram with the official logo.
  ============================================================
-->
<style>
  :root {
    --primary: #0B2A4A;          /* theme colour: set in the design studio theme */
    --primary-hover: #143F6B;
    --accent: #6BA32A;
    --link: #0F5FA8;
    --text: #212529;
    --muted: #6c757d;
    --border: #dee2e6;
    --light: #f8f9fa;
    --stripe: rgba(0,0,0,.035);
    --success: #198754; --info: #0c63a8; --warning: #b78103; --danger: #dc3545;
    --radius: 4px;
    --font: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; }
  a { color: var(--link); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  h1, h2, h3, h4, h5 { margin: 0 0 .6rem; font-weight: 600; line-height: 1.2; color: var(--text); }
  h1 { font-size: 2rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.25rem; } h4 { font-size: 1.1rem; } h5 { font-size: 1rem; }
  p { margin: 0 0 1rem; }
  .hidden { display: none !important; }
  .text-muted { color: var(--muted); }
  .text-end { text-align: right; }
  .small { font-size: .875rem; }
  .mt-1 { margin-top: .5rem; } .mt-2 { margin-top: 1rem; } .mt-3 { margin-top: 1.5rem; } .mb-0 { margin-bottom: 0; } .mb-2 { margin-bottom: 1rem; } .mb-3 { margin-bottom: 1.5rem; }
  :focus-visible { outline: 3px solid rgba(15,95,168,.45); outline-offset: 2px; }
  .container { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 16px; }

  /* Navbar (default header) */
  .navbar { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40; }
  .navbar-inner { display: flex; align-items: center; gap: 8px; min-height: 64px; flex-wrap: wrap; }
  .navbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; color: var(--primary); margin-right: 16px; cursor: pointer; }
  .navbar-brand:hover { text-decoration: none; }
  .logo-mark { width: 34px; height: 34px; border-radius: 6px; background: var(--primary); color: #fff; font-size: .8rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; border-bottom: 5px solid var(--accent); }
  .navbar-nav { display: flex; gap: 2px; flex: 1; }
  .nav-link { padding: 8px 12px; color: var(--text); border-bottom: 3px solid transparent; font-size: .975rem; cursor: pointer; }
  .nav-link:hover { color: var(--primary); text-decoration: none; background: var(--light); }
  .nav-link.active { border-bottom-color: var(--primary); color: var(--primary); font-weight: 600; }
  .navbar-right { display: flex; align-items: center; gap: 10px; }
  .navbar-toggler { display: none; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px; font-size: 1.1rem; cursor: pointer; margin-left: auto; }
  .nav-badge { background: var(--primary); color: #fff; border-radius: 10px; font-size: .75rem; padding: 1px 7px; margin-left: 4px; }
  .dropdown { position: relative; }
  .dropdown-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 180px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 6px 16px rgba(0,0,0,.12); padding: 6px 0; display: none; z-index: 60; }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-item { display: block; padding: 8px 16px; color: var(--text); cursor: pointer; font-size: .95rem; }
  .dropdown-item:hover { background: var(--light); text-decoration: none; }

  /* Buttons, forms */
  .btn { display: inline-block; font-family: inherit; font-size: 1rem; font-weight: 400; line-height: 1.5; padding: 6px 16px; border: 1px solid transparent; border-radius: var(--radius); cursor: pointer; text-align: center; background: transparent; color: var(--text); }
  .btn:hover { text-decoration: none; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-outline { border-color: var(--primary); color: var(--primary); background: #fff; }
  .btn-outline:hover { background: var(--primary); color: #fff; }
  .btn-secondary { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { background: var(--light); }
  .btn-light { background: #fff; color: var(--primary); border-color: #fff; }
  .btn-light:hover { background: var(--light); }
  .btn-sm { padding: 3px 10px; font-size: .875rem; }
  .btn-lg { padding: 10px 24px; font-size: 1.1rem; }
  .btn:disabled { opacity: .65; cursor: default; }
  .form-label { display: block; margin-bottom: 4px; font-weight: 600; font-size: .95rem; }
  .required::after { content: " *"; color: var(--danger); }
  .form-control, .form-select { display: block; width: 100%; padding: 6px 12px; font-family: inherit; font-size: 1rem; line-height: 1.5; color: var(--text); background: #fff; border: 1px solid #ced4da; border-radius: var(--radius); }
  .form-control:focus, .form-select:focus { outline: none; border-color: #86a8cc; box-shadow: 0 0 0 .2rem rgba(15,95,168,.2); }
  .form-control[readonly] { background: #e9ecef; }
  .form-select-sm { padding: 3px 8px; font-size: .875rem; width: auto; }
  .form-text { font-size: .85rem; color: var(--muted); margin-top: 3px; }
  .form-group { margin-bottom: 1rem; }
  fieldset { border: 0; padding: 0; margin: 0 0 1.5rem; }
  legend { font-size: 1.15rem; font-weight: 600; width: 100%; padding-bottom: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--border); color: var(--primary); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .input-group { display: flex; }
  .input-group .form-control { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .input-group .btn { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .qty { display: flex; align-items: center; gap: 10px; }
  .qty .form-control { max-width: 120px; }

  /* Cards, alerts, badges, breadcrumb */
  .card { border: 1px solid var(--border); border-radius: 6px; background: #fff; display: flex; flex-direction: column; }
  .card-body { padding: 20px; flex: 1; }
  .card-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; }
  .card-footer { padding: 12px 20px; border-top: 1px solid var(--border); background: var(--light); border-radius: 0 0 6px 6px; }
  .alert { padding: 12px 16px; border: 1px solid; border-radius: var(--radius); margin-bottom: 1rem; }
  .alert-warning { background: #fff3cd; border-color: #ffe69c; color: #664d03; }
  .alert-success { background: #d1e7dd; border-color: #badbcc; color: #0a3622; }
  .alert-info { background: #cfe2ff; border-color: #b6d4fe; color: #052c65; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: .78rem; font-weight: 600; color: #fff; }
  .bg-success { background: var(--success); } .bg-info { background: var(--info); } .bg-warning { background: #e0a800; color: #212529; } .bg-muted { background: var(--muted); }
  .breadcrumb { display: flex; flex-wrap: wrap; padding: 14px 0 6px; margin: 0; list-style: none; font-size: .9rem; color: var(--muted); }
  .breadcrumb li + li::before { content: "/"; padding: 0 8px; color: var(--muted); }

  /* Lists (Dataverse views) */
  .list-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 14px; }
  .list-toolbar .grow { flex: 1; min-width: 220px; }
  .list-toolbar .fld { min-width: 180px; }
  .table-wrap { overflow-x: auto; }
  table.table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
  table.table th, table.table td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; font-size: .95rem; }
  table.table thead th { border-bottom: 2px solid #adb5bd; background: #fff; font-weight: 600; white-space: nowrap; }
  table.table th.sortable { cursor: pointer; }
  table.table th.sortable:hover { background: var(--light); }
  table.table tbody tr:nth-child(odd) td { background: var(--stripe); }
  table.table tbody tr:hover td { background: rgba(15,95,168,.07); }
  .sort-ind { color: var(--muted); font-size: .7rem; margin-left: 4px; }
  .list-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .pagination { display: flex; list-style: none; margin: 0; padding: 0; }
  .page-link { display: block; padding: 6px 12px; border: 1px solid var(--border); margin-left: -1px; color: var(--link); background: #fff; cursor: pointer; font-size: .95rem; }
  .page-item:first-child .page-link { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
  .page-item:last-child .page-link { border-radius: 0 var(--radius) var(--radius) 0; }
  .page-item.active .page-link { background: var(--primary); border-color: var(--primary); color: #fff; }
  .page-item.disabled .page-link { color: var(--muted); pointer-events: none; background: var(--light); }
  .page-link:hover { background: var(--light); text-decoration: none; }
  .page-item.active .page-link:hover { background: var(--primary); }
  .empty { text-align: center; color: var(--muted); padding: 24px 0 !important; }

  /* Hero (design studio section with background) */
  .hero { background: linear-gradient(120deg, var(--primary), #1c4d73); color: #fff; padding: 72px 0 80px; }
  .hero h1 { color: #fff; font-size: 2.6rem; max-width: 760px; }
  .hero p { font-size: 1.2rem; max-width: 640px; opacity: .9; margin-bottom: 1.5rem; }

  /* Sign-in page */
  .signin { max-width: 440px; margin: 40px auto; }
  .signin-check { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 1rem; }

  /* Price field (custom code) */
  .price-field { border: 1px solid var(--border); border-radius: var(--radius); background: var(--light); padding: 12px 16px; }
  .price-field .price { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
  .tag { display: inline-block; font-size: .8rem; padding: 1px 8px; border-radius: 10px; background: var(--light); border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }

  /* Footer (default) */
  .footer { background: var(--light); border-top: 1px solid var(--border); padding: 22px 0; font-size: .9rem; color: var(--muted); margin-top: 48px; }
  .footer .container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

  /* Demo tools: component overlay + log */
  .tools { position: fixed; left: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .tool-btn { background: #212529; color: #fff; border: none; border-radius: 20px; padding: 8px 14px; font: 600 13px var(--font); cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .tool-btn.on { background: var(--accent); }
  .legend { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; }
  body.show-pp .legend { display: block; }
  .legend div { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .trace-panel { position: fixed; left: 16px; bottom: 112px; z-index: 90; width: 400px; max-width: calc(100vw - 32px); max-height: 300px; overflow: auto; background: #0A1E33; color: #D5E3EF; border-radius: 8px; padding: 12px 14px; font: 12px Consolas, 'Courier New', monospace; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .trace-panel .t-title { font: 700 13px var(--font); color: #fff; margin-bottom: 6px; }
  .trace-panel .t-line { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .trace-panel .t-line b { color: #9AD25A; }
  .trace-panel .t-empty { color: #8FA6BA; }

  [data-pp-type="oob"]  { --pp-c: #107C10; }
  [data-pp-type="low"]  { --pp-c: #C25A0E; }
  [data-pp-type="code"] { --pp-c: #7A5CB8; }
  body.show-pp [data-pp-label] { position: relative; outline: 2px dashed var(--pp-c); outline-offset: 5px; margin-top: 30px; }
  body.show-pp [data-pp-label]::before { content: attr(data-pp-label); position: absolute; top: -27px; left: -2px; background: var(--pp-c); color: #fff; font: 600 11px/1 var(--font); padding: 5px 9px; border-radius: 3px 3px 0 0; white-space: nowrap; z-index: 30; }
  body.show-pp header.navbar[data-pp-label] { margin-top: 0; outline-offset: -2px; }
  body.show-pp header.navbar[data-pp-label]::before { top: auto; bottom: -1px; left: 8px; border-radius: 3px 3px 0 0; transform: translateY(100%); border-radius: 0 0 3px 3px; }
  body.show-pp .hero[data-pp-label] { margin-top: 0; outline-offset: -4px; }
  body.show-pp .hero[data-pp-label]::before { top: 4px; left: 4px; border-radius: 3px; }
  body.show-pp .footer[data-pp-label] { margin-top: 48px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 900px) {
    .navbar-toggler { display: block; }
    .navbar-nav { display: none; width: 100%; flex-direction: column; order: 5; }
    .navbar-nav.open { display: flex; }
    .navbar-right { margin-left: auto; }
    .row2, .row3 { grid-template-columns: 1fr; }
    .hero h1 { font-size: 2rem; }
    .navbar-brand span:last-child { max-width: 150px; font-size: 1rem; }
  }
</style>
</head>
<body>

<header class="navbar" data-pp-label="Header · Web template (Liquid)" data-pp-type="low">
  <div class="container navbar-inner">
    <a class="navbar-brand" onclick="navigate('home')"><span class="logo-mark">DH</span><span id="site-name"></span></a>
    <button class="navbar-toggler" onclick="document.getElementById('navbar-nav').classList.toggle('open')" data-i18n-title="pp_toggle_nav">☰</button>
    <nav class="navbar-nav" id="navbar-nav">
      <a class="nav-link" id="nav-home" onclick="navigate('home')" data-i18n="pp_home"></a>
      <a class="nav-link" id="nav-shop" onclick="go('shop')" data-i18n="nav_shop"></a>
      <a class="nav-link" id="nav-orders" onclick="go('orders')" data-i18n="nav_orders"></a>
      <a class="nav-link" onclick="alert(t('alert_contact'))" data-i18n="nav_contact"></a>
    </nav>
    <div class="navbar-right">
      <select class="form-select form-select-sm" id="lang-select" onchange="setLang(this.value)" data-i18n-title="lang_label"></select>
      <a class="nav-link hidden" id="nav-cart" onclick="go('cart')"><span data-i18n="pp_cart"></span><span class="nav-badge" id="cart-badge">0</span></a>
      <div id="auth-anon"><button class="btn btn-primary btn-sm" onclick="navigate('login')" data-i18n="pp_signin"></button></div>
      <div id="auth-user" class="dropdown hidden">
        <a class="nav-link" onclick="document.getElementById('auth-user').classList.toggle('open');event.stopPropagation();"><span id="user-name"></span> ▾</a>
        <div class="dropdown-menu">
          <a class="dropdown-item" onclick="alert(t('pp_alert_profile'))" data-i18n="pp_profile"></a>
          <a class="dropdown-item" onclick="signOut()" data-i18n="pp_signout"></a>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="container"><ul class="breadcrumb hidden" id="breadcrumb" data-pp-label="Breadcrumb · Web template" data-pp-type="oob"></ul></div>

  <!-- HOME -->
  <div id="page-home" class="pp-page">
    <section class="hero" data-pp-label="Section · Hero banner (design studio)" data-pp-type="oob">
      <div class="container">
        <h1 data-i18n="pp_home_title"></h1>
        <p data-i18n="pp_home_sub"></p>
        <button class="btn btn-light btn-lg" id="hero-btn"></button>
      </div>
    </section>

    <div class="container mt-3" id="home-anon">
      <div class="row3" data-pp-label="Section · 3 columns with text" data-pp-type="oob">
        <div class="card"><div class="card-body"><h3 class="card-title" data-i18n="f1_t"></h3><p class="mb-0" data-i18n="f1_p"></p></div></div>
        <div class="card"><div class="card-body"><h3 class="card-title" data-i18n="f2_t"></h3><p class="mb-0" data-i18n="f2_p"></p></div></div>
        <div class="card"><div class="card-body"><h3 class="card-title" data-i18n="f3_t"></h3><p class="mb-0" data-i18n="f3_p"></p></div></div>
      </div>
    </div>

    <div class="container mt-3 hidden" id="home-auth">
      <h2 id="home-greeting"></h2>
      <div class="alert alert-warning" id="home-alert" data-pp-label="Content snippet · Liquid (silo alert)" data-pp-type="low"></div>

      <div class="row3 mt-2" data-pp-label="Section · 3 columns with buttons" data-pp-type="oob">
        <div class="card"><div class="card-body"><h3 class="card-title" data-i18n="nav_shop"></h3><p data-i18n="pp_c1_p"></p></div><div class="card-footer"><button class="btn btn-primary btn-sm" onclick="navigate('shop')" data-i18n="pp_open"></button></div></div>
        <div class="card"><div class="card-body"><h3 class="card-title" data-i18n="nav_orders"></h3><p data-i18n="pp_c2_p"></p></div><div class="card-footer"><button class="btn btn-primary btn-sm" onclick="navigate('orders')" data-i18n="pp_open"></button></div></div>
        <div class="card"><div class="card-body"><h3 class="card-title" data-i18n="c_advisor"></h3><p class="mb-2"><strong id="adv-name"></strong><br><span class="text-muted" id="adv-role"></span></p><p class="mb-0 small" id="adv-contact"></p></div></div>
      </div>

      <h3 class="mt-3" data-i18n="c_open"></h3>
      <div data-pp-label="List · Dataverse view (open orders)" data-pp-type="oob">
        <div class="table-wrap">
          <table class="table"><thead><tr><th data-i18n="th_order"></th><th data-i18n="th_date"></th><th data-i18n="th_delivery"></th><th data-i18n="th_status"></th></tr></thead><tbody id="home-orders"></tbody></table>
        </div>
      </div>
      <a onclick="navigate('orders')" data-i18n="lnk_all_orders"></a>
    </div>
  </div>

  <!-- SIGN IN -->
  <div id="page-login" class="pp-page hidden">
    <div class="container">
      <div class="signin" data-pp-label="Authentication · Entra External ID / local sign-in" data-pp-type="oob">
        <h2 data-i18n="pp_signin"></h2>
        <p class="text-muted" data-i18n="login_sub"></p>
        <div class="form-group"><label class="form-label" for="login-email" data-i18n="lbl_email"></label><input type="email" class="form-control" id="login-email" value="jan@vanderveen-farm.example"></div>
        <div class="form-group"><label class="form-label" for="login-pw" data-i18n="lbl_password"></label><input type="password" class="form-control" id="login-pw" value="demo"></div>
        <div class="signin-check"><label><input type="checkbox"> <span data-i18n="pp_remember"></span></label><a onclick="alert('Demo')" data-i18n="pp_forgot"></a></div>
        <button class="btn btn-primary" style="width:100%" onclick="signIn()" data-i18n="pp_signin"></button>
        <div class="alert alert-info mt-2 small" data-i18n-html="demo_note"></div>
      </div>
    </div>
  </div>

  <!-- ORDER FEED: LIST -->
  <div id="page-shop" class="pp-page hidden">
    <div class="container mt-2">
      <h1 data-i18n="shop_title"></h1>
      <p class="text-muted" data-i18n="shop_sub"></p>
      <div data-pp-label="List · Dataverse view with search, filter, sort and paging" data-pp-type="oob">
        <div class="list-toolbar">
          <div class="grow">
            <label class="form-label" for="shop-q" data-i18n="pp_search"></label>
            <div class="input-group"><input type="text" class="form-control" id="shop-q" data-i18n-ph="cat_search_ph" onkeydown="if(event.key==='Enter')shopSearch()"><button class="btn btn-primary" onclick="shopSearch()" data-i18n="pp_search"></button></div>
          </div>
          <div class="fld"><label class="form-label" for="shop-group" data-i18n="pp_group"></label><select class="form-select" id="shop-group" onchange="shopFilter()"></select></div>
          <div class="fld"><label class="form-label" for="shop-view" data-i18n="pp_view"></label><select class="form-select" id="shop-view" onchange="shopView()"></select></div>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th class="sortable" onclick="shopSort('id')"><span data-i18n="th_article"></span><span class="sort-ind" id="si-id"></span></th>
              <th class="sortable" onclick="shopSort('name')"><span data-i18n="th_feed"></span><span class="sort-ind" id="si-name"></span></th>
              <th data-i18n="pp_specification"></th>
              <th class="sortable" onclick="shopSort('cat')"><span data-i18n="pp_group"></span><span class="sort-ind" id="si-cat"></span></th>
              <th></th>
            </tr></thead>
            <tbody id="shop-rows"></tbody>
          </table>
        </div>
        <div class="list-footer"><span class="small text-muted" id="shop-count"></span><ul class="pagination" id="shop-pages"></ul></div>
      </div>
    </div>
  </div>

function fmtEur(n, d) { d = d === undefined ? 2 : d; return '€ ' + n.toLocaleString(L().locale, { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtNum(n, d) { return n.toLocaleString(L().locale, { minimumFractionDigits: 0, maximumFractionDigits: d || 0 }); }
function seed(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return (h % 1000) / 1000; }
function isoWeek(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil(((x - y0) / 86400000 + 1) / 7);
}
function daysFromNow(n) { const d = new Date(); d.setDate(d.getDate() + n); return d; }
function fmtDate(d) { return d.toLocaleDateString(L().locale, { day: '2-digit', month: '2-digit', year: 'numeric' }); }

/* Pricing logic (in production: Power Pages -> Dataverse virtual table -> F&O price discovery) */
function priceFor(p, formKey, qty) {
  const f = CONFIG.forms[formKey];
  const perTon = p.priceMin + (p.priceMax - p.priceMin) * seed(p.id);
  const kg = f.kg * qty;
  const discount = kg >= 20000 ? 0.025 : (kg >= 10000 ? 0.01 : 0);
  return { unit: (perTon * f.kg / 1000 + f.sur) * (1 - discount), perTon: perTon * (1 - discount), discount };
}

/* Delivery terms are stored language-neutral: 'route' | 'week:N' | 'date' */
function termOptions() {
  const wk = isoWeek(new Date()), o = [{ v: 'route', l: t('term_route') }];
  for (let i = 1; i <= 3; i++) { const n = ((wk + i - 1) % 52) + 1; o.push({ v: 'week:' + n, l: t('term_week', { n }) }); }
  o.push({ v: 'date', l: t('term_date') });
  return o;
}
function termLabel(v, short) {
  if (v === 'route') return t(short ? 'term_route_short' : 'term_route');
  if (v === 'date')  return t(short ? 'term_date_short' : 'term_date');
  return t('term_week', { n: v.split(':')[1] });
}

  vsel.innerHTML = `<option value="all">${t('pp_view_all')}</option><option value="favs">${t('pp_view_favs')}</option>`;
  vsel.value = s.view;
  document.getElementById('shop-q').value = s.q;
  renderShopRows();
}
function shopSearch() { state.shop.q = document.getElementById('shop-q').value.trim(); state.shop.page = 1; renderShopRows(); }
function shopFilter() { state.shop.group = document.getElementById('shop-group').value; state.shop.page = 1; renderShopRows(); }
function shopView() { state.shop.view = document.getElementById('shop-view').value; state.shop.page = 1; renderShopRows(); }
function shopSort(k) { const s = state.shop; if (s.sort === k) s.dir *= -1; else { s.sort = k; s.dir = 1; } renderShopRows(); }
function shopPage(n) { state.shop.page = n; renderShopRows(); }

function renderShopRows() {
  const s = state.shop, q = s.q.toLowerCase();
  let list = CONFIG.products.filter(p =>
    (s.group === 'all' || p.cat === s.group) &&
    (s.view === 'all' || state.favs.includes(p.id)) &&
    (!q || pn(p.id).toLowerCase().includes(q) || p.id.includes(q) || ps(p.id).toLowerCase().includes(q)));
  const val = p => s.sort === 'id' ? p.id : (s.sort === 'cat' ? cn(p.cat) : pn(p.id));
  list.sort((a, b) => val(a).localeCompare(val(b), L().locale) * s.dir);
  ['id','name','cat'].forEach(k => document.getElementById('si-' + k).textContent = s.sort === k ? (s.dir === 1 ? '▲' : '▼') : '');

  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (s.page > pages) s.page = pages;
  const start = (s.page - 1) * PAGE_SIZE, slice = list.slice(start, start + PAGE_SIZE);
  document.getElementById('shop-rows').innerHTML = slice.length ? slice.map(p => `<tr>
      <td class="text-muted">${p.id}</td><td><a onclick="navigate('article','${p.id}')"><strong>${pn(p.id)}</strong></a></td>
      <td>${ps(p.id)}</td><td>${cn(p.cat)}</td>
      <td class="text-end"><button class="btn btn-outline btn-sm" onclick="navigate('article','${p.id}')">${t('btn_order')}</button></td></tr>`).join('')
    : `<tr><td colspan="5" class="empty">${t('pp_no_records')}</td></tr>`;
  document.getElementById('shop-count').textContent = list.length ? t('pp_showing', { a: start + 1, b: start + slice.length, n: list.length }) : '';
  let pg = `<li class="page-item ${s.page === 1 ? 'disabled' : ''}"><a class="page-link" onclick="shopPage(${s.page - 1})">${t('pp_prev')}</a></li>`;
  for (let i = 1; i <= pages; i++) pg += `<li class="page-item ${i === s.page ? 'active' : ''}"><a class="page-link" onclick="shopPage(${i})">${i}</a></li>`;
  pg += `<li class="page-item ${s.page === pages ? 'disabled' : ''}"><a class="page-link" onclick="shopPage(${s.page + 1})">${t('pp_next')}</a></li>`;
  document.getElementById('shop-pages').innerHTML = pages > 1 ? pg : '';
}

/* ================================================================
   ORDER LINE FORM
   ================================================================ */
function renderArticle() {
  const p = productById(state.currentArticle);
  if (!p) return;
  document.getElementById('article-name').textContent = pn(p.id);
  document.getElementById('article-meta').textContent = ps(p.id);
  document.getElementById('f-id').value = p.id;
  document.getElementById('f-group').value = cn(p.cat);
  document.getElementById('f-forms').value = p.forms.map(k => t('form_' + k + '_l')).join(', ');
  document.getElementById('order-form').innerHTML = p.forms.map(k => `<option value="${k}">${t('form_' + k + '_l')}</option>`).join('');
  document.getElementById('order-location').innerHTML = CONFIG.customer.locations.map((l, i) => `<option value="${i}">${locLabel(i)}</option>`).join('');
  document.getElementById('order-term').innerHTML = termOptions().map(o => `<option value="${o.v}">${o.l}</option>`).join('');
  document.getElementById('order-note').value = '';
  renderSiloOptions();
  onFormChange();
}
function renderSiloOptions() {
  const i = +document.getElementById('order-location').value || 0, n = CONFIG.customer.locations[i].silos;
  document.getElementById('order-silo').innerHTML = Array.from({ length: n }, (_, j) => `<option value="${j}">${siloLabel(i, j)}</option>`).join('');
}
function onFormChange() {
  const f = CONFIG.forms[document.getElementById('order-form').value];
  document.getElementById('silo-group').classList.toggle('hidden', !f.silo);
  const q = document.getElementById('order-qty'); q.min = f.min; q.step = f.step; q.value = f.min;
  fetchPrice();
}
function fetchPrice(manual) {
  const p = productById(state.currentArticle);
  if (!p) return;
  const formKey = document.getElementById('order-form').value, f = CONFIG.forms[formKey];
  const qty = Math.max(f.min, parseInt(document.getElementById('order-qty').value) || f.min);
  document.getElementById('price-label').textContent = t('price_label', { unit: unitName(f.unitKey, 1) });
  document.getElementById('qty-unit').textContent = unitName(f.unitKey, qty);
  document.getElementById('qty-hint').textContent = t('qty_hint', { qty, unitQty: unitName(f.unitKey, qty), tons: fmtNum(qty * f.kg / 1000, 2), min: f.min, unitMin: unitName(f.unitKey, f.min) });
  const el = document.getElementById('article-price');
  el.innerHTML = '<span class="small text-muted">' + t('price_loading') + '</span>';
  document.getElementById('article-price-sub').textContent = '';
  const t0 = performance.now();
  setTimeout(() => {
    const r = priceFor(p, formKey, qty);
    state.currentPrice = r.unit;
    el.textContent = fmtEur(r.unit);
    document.getElementById('article-price-sub').innerHTML = t('pp_total_excl') + ': <strong>' + fmtEur(r.unit * qty) + '</strong> · ' + fmtEur(r.perTon) + ' ' + t('pp_per_ton') +
      (r.discount ? '<br>' + t('pp_volume_disc', { x: fmtNum(r.discount * 100, 1) }) : '');
    trace(`<b>GET</b> /_api/dh_dailyprice?item=${p.id}&amp;qty=${qty}&amp;form=${formKey} → ${fmtEur(r.unit)} (${Math.round(performance.now() - t0)} ms, F&amp;O price discovery)`);
  }, manual ? 700 : 350);
}

/* ================================================================
   CART
   ================================================================ */
function addToCart(btn) {
  const p = productById(state.currentArticle);
  const formKey = document.getElementById('order-form').value, f = CONFIG.forms[formKey];
  const qty = Math.max(f.min, parseInt(document.getElementById('order-qty').value) || f.min);
  state.cart.push({
    productId: p.id, formKey, qty,
    locIdx: +document.getElementById('order-location').value || 0,
    siloIdx: f.silo ? (+document.getElementById('order-silo').value || 0) : null,
    term: document.getElementById('order-term').value, note: document.getElementById('order-note').value,
    unitPrice: state.currentPrice || priceFor(p, formKey, qty).unit
  });
  trace(`<b>POST</b> /_api/dh_cartlines → line added (${qty} × ${formKey}, item ${p.id})`);
  btn.textContent = t('added'); btn.disabled = true;
  setTimeout(() => { btn.textContent = t('btn_add'); btn.disabled = false; navigate('cart'); }, 500);
}
function removeFromCart(i) { state.cart.splice(i, 1); renderCart(); updateChrome(); }

function renderCart() {
  const full = document.getElementById('cart-full'), empty = document.getElementById('cart-empty');
  if (!state.cart.length) { full.classList.add('hidden'); empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden'); full.classList.remove('hidden');
  document.getElementById('cart-rows').innerHTML = state.cart.map((it, i) => {
    const f = CONFIG.forms[it.formKey];
    return `<tr>
      <td><strong>${pn(it.productId)}</strong><br><span class="small text-muted">${t('form_' + it.formKey + '_l')}</span>${it.note ? `<br><span class="small text-muted">${t('note_inline')} ${it.note.replace(/</g, '&lt;')}</span>` : ''}</td>
      <td>${it.qty} ${unitName(f.unitKey, it.qty)}</td>
      <td>${locLabel(it.locIdx)}${it.siloIdx !== null ? `<br><span class="small text-muted">${siloLabel(it.locIdx, it.siloIdx)}</span>` : ''}</td>
      <td>${termLabel(it.term)}</td>
      <td class="text-end">${fmtEur(it.qty * it.unitPrice)}</td>
      <td class="text-end"><button class="btn btn-secondary btn-sm" onclick="removeFromCart(${i})">${t('remove')}</button></td></tr>`;
  }).join('');
  const sub = state.cart.reduce((s, i) => s + i.qty * i.unitPrice, 0);
  const kg = state.cart.reduce((s, i) => s + i.qty * CONFIG.forms[i.formKey].kg, 0);
  document.getElementById('summary-lines').textContent = state.cart.length;
  document.getElementById('summary-weight').textContent = fmtNum(kg / 1000, 1) + ' t';
  document.getElementById('summary-subtotal').textContent = fmtEur(sub);
  document.getElementById('summary-vat-label').textContent = t('sum_vat', { p: Math.round(CONFIG.vatRate * 100) });
  document.getElementById('summary-vat').textContent = fmtEur(sub * CONFIG.vatRate);
  document.getElementById('summary-total').textContent = fmtEur(sub * (1 + CONFIG.vatRate));
}

function placeOrder() {
  if (!state.cart.length) return;
  state.orderCounter++;
  const id = 'SO-2026-0' + state.orderCounter;
  const sub = state.cart.reduce((s, i) => s + i.qty * i.unitPrice, 0);
  const kg = state.cart.reduce((s, i) => s + i.qty * CONFIG.forms[i.formKey].kg, 0);
  CONFIG.orders.unshift({ id, ago: 0, lines: state.cart.length, kg, deliveryTerm: state.cart[0].term, total: sub * (1 + CONFIG.vatRate), statusKey: "st_sent", statusType: "info",
    lineItems: state.cart.map(i => ({ pid: i.productId, formKey: i.formKey, qty: i.qty, net: i.qty * i.unitPrice })) });
  trace(`<b>POST</b> /_api/dh_placeorder → Power Automate → F&amp;O SalesOrderHeaderV2 ${id} (${state.cart.length} lines)`);
  state.lastOrder = id; state.cart = [];
  navigate('done');
}

/* ================================================================
   ORDERS LIST + DETAILS
   ================================================================ */
function renderOrders() {
  const sel = document.getElementById('orders-view');
  sel.innerHTML = `<option value="all">${t('pp_view_orders_all')}</option><option value="open">${t('c_open')}</option>`;
  sel.value = state.ordersView;
  const list = CONFIG.orders.filter(o => state.ordersView === 'all' || o.statusType !== 'success');
  document.getElementById('orders-rows').innerHTML = list.length ? list.map(o => `<tr>
    <td><a onclick="navigate('order','${o.id}')"><strong>${o.id}</strong></a></td><td>${fmtDate(daysFromNow(-o.ago))}</td><td>${o.lines}</td>
    <td>${fmtNum(o.kg / 1000, 1)} t</td><td>${deliveryText(o)}</td><td class="text-end">${fmtEur(o.total)}</td><td>${statusBadge(o)}</td></tr>`).join('')
    : `<tr><td colspan="7" class="empty">${t('pp_no_records')}</td></tr>`;
  document.getElementById('orders-count').textContent = list.length ? t('pp_showing', { a: 1, b: list.length, n: list.length }) : '';
  trace('<b>GET</b> /_api/salesorders?$filter=account eq ' + CONFIG.customer.accountId + ' → ' + CONFIG.orders.length + ' orders (virtual table)');
}
function ordersView() { state.ordersView = document.getElementById('orders-view').value; renderOrders(); }

function orderLines(o) {
  if (o.lineItems) return o.lineItems;
  const items = [], n = o.lines, net = o.total / (1 + CONFIG.vatRate);
  let rawSum = 0;
  for (let i = 0; i < n; i++) {
    const p = CONFIG.products[Math.floor(seed(o.id + i) * CONFIG.products.length)];
    const formKey = p.forms.includes('bulk') ? 'bulk' : p.forms[0], f = CONFIG.forms[formKey];
    const qty = Math.max(1, Math.round((o.kg / n) / f.kg));
    const raw = priceFor(p, formKey, qty).unit * qty;
    rawSum += raw; items.push({ pid: p.id, formKey, qty, net: raw });
  }
  items.forEach(it => it.net = it.net * net / rawSum);
  return items;
}
function renderOrderDetail() {
  const o = CONFIG.orders.find(x => x.id === state.currentOrder);
  if (!o) return;
  document.getElementById('order-title').textContent = t('pp_order_title', { id: o.id });
  document.getElementById('o-id').value = o.id;
  document.getElementById('o-date').value = fmtDate(daysFromNow(-o.ago));
  document.getElementById('o-status').value = t(o.statusKey);
  document.getElementById('o-delivery').value = deliveryText(o);
  document.getElementById('o-weight').value = fmtNum(o.kg / 1000, 1) + ' t';
  document.getElementById('o-total').value = fmtEur(o.total);
  document.getElementById('o-lines').innerHTML = orderLines(o).map(it => `<tr><td>${pn(it.pid)}</td><td>${it.qty} ${unitName(CONFIG.forms[it.formKey].unitKey, it.qty)}</td><td class="text-end">${fmtEur(it.net)}</td></tr>`).join('');
}

/* ================================================================
   INIT
   ================================================================ */
applyI18n();
navigate('home');
</script>
