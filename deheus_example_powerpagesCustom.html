<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De Heus Feed - Customer Portal (demo)</title>
<!--
  ============================================================
  POWER PAGES eCOMMERCE DEMO - DE HEUS VERSION (SINGLE FILE)
  Languages: English (default), Dutch, Czech - switch with the
  language selector in the header.
  ============================================================
  Purpose: Clickable demo of a Power Pages ordering portal for
           farmers, connected to Dynamics 365 F&O through Dataverse
           virtual tables, with a real-time daily price API and
           F&O order integration.

  Reuse / adapt:
    1. Colours  : CSS variables in :root (--color-primary, --color-accent)
    2. Content  : CONFIG object in <script> (customer, silos, products,
                  delivery forms, orders)
    3. Texts    : I18N (UI), CAT_TXT (categories), P_TXT (products)
    4. Logo     : the "DH" monogram is a placeholder. Replace it with the
                  official logo (search for 'logo-mark').

  Note: colours approximate an agri/feed look (navy + grass green).
  Check the official brand guide for exact hex codes. Czech and Dutch
  texts are demo quality: have a native speaker review them.
  ============================================================
-->
<style>
  :root {
    --color-primary:        #0B2A4A;   /* diep navy: header, knoppen, tekst-accenten */
    --color-primary-hover:  #143F6B;
    --color-accent:         #6BA32A;   /* grasgroen: acties, voortgang */
    --color-accent-hover:   #598822;
    --color-accent-soft:    #EAF3DC;
    --color-straw:          #E9B949;   /* korenkleur: waarschuwingen, markeringen */
    --color-straw-soft:     #FCF2D9;
    --color-bg:             #F2F5F4;
    --color-surface:        #FFFFFF;
    --color-text:           #14212E;
    --color-text-muted:     #5B6B79;
    --color-border:         #DDE4E8;
    --color-border-strong:  #B9C5CD;
    --color-success:        #2E7D32;
    --color-info:           #1B65A8;
    --color-warning:        #B7791F;
    --color-danger:         #C0392B;

    --shadow-sm: 0 1px 2px rgba(11,42,74,0.06);
    --shadow-md: 0 6px 18px rgba(11,42,74,0.08);
    --shadow-lg: 0 18px 44px rgba(11,42,74,0.18);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;

    --font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-family);
    font-size: 15px;
    line-height: 1.55;
    color: var(--color-text);
    background: var(--color-bg);
    min-height: 100vh;
  }
  a { color: var(--color-primary); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  h1, h2, h3, h4 { margin: 0 0 10px; color: var(--color-primary); font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  h1 { font-size: 30px; }
  h2 { font-size: 22px; }
  h3 { font-size: 17px; }
  h4 { font-size: 15px; }
  p { margin: 0 0 12px; }
  :focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .text-muted { color: var(--color-text-muted); }
  .text-right { text-align: right; }
  .mt-1 { margin-top: 8px; } .mt-2 { margin-top: 16px; } .mt-3 { margin-top: 28px; }

  /* ---------- Topbar (header + navigation) ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--color-border);
    padding: 12px 32px;
    display: flex; align-items: center; gap: 28px;
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; flex-shrink: 0; }
  .logo-mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--color-primary);
    color: #fff; font-weight: 800; font-size: 15px; letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .logo-mark::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 7px;
    background: var(--color-accent);
  }
  .brand-text { font-weight: 700; font-size: 17px; color: var(--color-primary); line-height: 1.15; }
  .brand-text small { display: block; font-weight: 400; font-size: 12px; color: var(--color-text-muted); }

  .main-nav { display: flex; gap: 4px; flex: 1; }
  .main-nav a {
    padding: 8px 16px; border-radius: 999px;
    font-weight: 600; font-size: 14px; color: var(--color-text-muted);
    transition: background .15s, color .15s;
  }
  .main-nav a:hover { background: var(--color-bg); color: var(--color-primary); text-decoration: none; }
  .main-nav a.active { background: var(--color-primary); color: #fff; }

  .user-area { display: flex; align-items: center; gap: 14px; }
  .user-text { text-align: right; font-size: 13px; line-height: 1.3; color: var(--color-text-muted); }
  .user-text strong { color: var(--color-text); display: block; font-size: 14px; }
  .icon-btn {
    position: relative; width: 40px; height: 40px; border-radius: 50%;
    background: var(--color-bg); border: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: center;
    color: var(--color-primary); cursor: pointer; transition: background .15s;
  }
  .icon-btn:hover { background: var(--color-accent-soft); }
  .cart-badge {
    position: absolute; top: -5px; right: -5px;
    background: var(--color-accent); color: #fff;
    font-size: 11px; font-weight: 700;
    min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
  }

  .breadcrumb { padding: 14px 32px 0; max-width: 1280px; margin: 0 auto; font-size: 13px; color: var(--color-text-muted); }
  .breadcrumb span { margin: 0 8px; color: var(--color-border-strong); }

  .container { max-width: 1280px; margin: 0 auto; padding: 24px 32px 48px; }

  /* ---------- Cards, buttons, forms ---------- */
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
  }
  .card-title { font-size: 16px; font-weight: 700; color: var(--color-primary); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .card-footer-link { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--color-border); font-size: 14px; font-weight: 600; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-sidebar { display: grid; grid-template-columns: 270px 1fr; gap: 28px; align-items: start; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 20px; font-family: inherit; font-size: 14px; font-weight: 600;
    border: 1px solid transparent; border-radius: 999px;
    background: var(--color-surface); color: var(--color-primary);
    cursor: pointer; transition: background .15s, transform .1s, box-shadow .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-accent { background: var(--color-accent); color: #fff; }
  .btn-accent:hover { background: var(--color-accent-hover); }
  .btn-secondary { border-color: var(--color-border-strong); background: var(--color-surface); }
  .btn-secondary:hover { background: var(--color-accent-soft); border-color: var(--color-accent); }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .btn-lg { padding: 14px 30px; font-size: 16px; }
  .btn-block { display: flex; width: 100%; }
  .btn:disabled { opacity: .6; cursor: default; }

  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .required { color: var(--color-danger); }
  .form-control {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 15px; background: #fff; color: var(--color-text);
  }
  .form-control:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(107,163,42,.22); }
  .form-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .section-title { font-size: 15px; font-weight: 700; color: var(--color-primary); padding: 4px 0 10px; margin-bottom: 12px; border-bottom: 1px solid var(--color-border); }
  .facts { display: grid; grid-template-columns: 180px 1fr; row-gap: 8px; column-gap: 16px; font-size: 14px; margin-bottom: 24px; }
  .facts dt { color: var(--color-text-muted); }
  .facts dd { margin: 0; font-weight: 600; }

  .qty-stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); overflow: hidden; background: #fff; }
  .qty-stepper button { width: 44px; border: none; background: var(--color-bg); font-size: 20px; cursor: pointer; color: var(--color-primary); }
  .qty-stepper button:hover { background: var(--color-accent-soft); }
  .qty-stepper input { width: 90px; border: none; text-align: center; font-size: 17px; font-weight: 700; font-family: inherit; padding: 10px 0; color: var(--color-primary); }
  .qty-stepper input:focus { outline: none; }
  .qty-hint { margin-left: 14px; font-size: 13px; color: var(--color-text-muted); }

  /* ---------- Tables & badges ---------- */
  table.data-table { width: 100%; border-collapse: collapse; background: var(--color-surface); }
  table.data-table th { text-align: left; padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--color-text-muted); background: var(--color-bg); border-bottom: 1px solid var(--color-border); }
  table.data-table td { padding: 14px 16px; border-bottom: 1px solid var(--color-border); font-size: 14px; }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table tbody tr:hover td { background: #F8FBF3; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-success { background: #E3F3E4; color: var(--color-success); }
  .badge-info    { background: #E1EEF9; color: var(--color-info); }
  .badge-warning { background: var(--color-straw-soft); color: var(--color-warning); }
  .badge-muted   { background: var(--color-border); color: var(--color-text-muted); }

  /* ---------- Landing ---------- */
  .landing-hero {
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, #0B2A4A 0%, #123A63 60%, #1C4D73 100%);
    color: #fff; padding: 96px 32px 140px;
  }
  .landing-hero::after {  /* rolling grain field */
    content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 90px;
    background:
      radial-gradient(ellipse 60% 100% at 20% 100%, var(--color-bg) 98%, transparent 100%),
      radial-gradient(ellipse 70% 100% at 75% 100%, var(--color-bg) 98%, transparent 100%);
  }
  .landing-hero .inner { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1.15fr 1fr; gap: 48px; align-items: center; position: relative; z-index: 1; }
  .landing-hero h1 { color: #fff; font-size: 48px; line-height: 1.08; margin-bottom: 18px; }
  .landing-hero .tagline { font-size: 19px; color: rgba(255,255,255,.82); max-width: 560px; margin-bottom: 30px; }
  .cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .landing-hero .btn-secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
  .landing-hero .btn-secondary:hover { background: rgba(255,255,255,.12); border-color: #fff; }

  .hero-silos { display: flex; justify-content: center; align-items: flex-end; gap: 22px; }
  .hero-silo { text-align: center; color: rgba(255,255,255,.85); font-size: 13px; }
  .hero-silo .tube { margin: 0 auto 8px; }

  .landing-features { padding: 40px 32px 70px; }
  .landing-features .inner { max-width: 1280px; margin: 0 auto; }
  .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 24px; }
  .feature-item { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 26px; box-shadow: var(--shadow-sm); }
  .feature-item .icon { font-size: 26px; width: 52px; height: 52px; border-radius: 14px; background: var(--color-accent-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .feature-item p { color: var(--color-text-muted); margin: 0; font-size: 14px; }
  .landing-footer { background: var(--color-primary); color: rgba(255,255,255,.75); padding: 28px 32px; text-align: center; font-size: 13px; }

  /* ---------- Login ---------- */
  .login-page { min-height: 100vh; background: linear-gradient(160deg, #0B2A4A, #1C4D73); display: flex; align-items: center; justify-content: center; padding: 40px; }
  .login-card { background: #fff; border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); }
  .login-card .brand { margin-bottom: 26px; }
  .demo-note { background: var(--color-straw-soft); border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 18px; font-size: 13px; color: var(--color-text-muted); }

  /* ---------- Dashboard ---------- */
  .welcome-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .next-delivery {
    display: flex; align-items: center; gap: 14px;
    background: var(--color-primary); color: #fff;
    padding: 14px 22px; border-radius: var(--radius-md);
  }
  .next-delivery .truck { font-size: 28px; }
  .next-delivery strong { display: block; font-size: 16px; }
  .next-delivery small { color: rgba(255,255,255,.75); }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .kpi-card { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 18px 20px; }
  .kpi-card .label { font-size: 13px; color: var(--color-text-muted); margin-bottom: 4px; }
  .kpi-card .value { font-size: 28px; font-weight: 700; color: var(--color-primary); line-height: 1.1; }
  .kpi-card .sub { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }

  /* Silos: the eye-catching element of the portal */
  .silo-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .silo { display: grid; grid-template-columns: 74px 1fr; gap: 16px; align-items: end; }
  .tube {
    position: relative; width: 62px; height: 150px;
    background: #E7EDF0; border: 2px solid var(--color-border-strong);
    border-radius: 31px 31px 6px 6px; overflow: hidden;
  }
  .tube .fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, var(--color-accent), #4E8A1E); transition: height .9s cubic-bezier(.2,.7,.2,1); }
  .tube.low .fill { background: linear-gradient(180deg, var(--color-straw), #C98F1B); }
  .tube .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(to top, transparent 0, transparent 36px, rgba(11,42,74,.14) 36px, rgba(11,42,74,.14) 37px); }
  .silo .info strong { display: block; font-size: 15px; color: var(--color-primary); }
  .silo .info .prod { font-size: 13px; color: var(--color-text-muted); margin-bottom: 8px; }
  .silo .info .pct { font-size: 26px; font-weight: 700; color: var(--color-primary); line-height: 1; }
  .silo .info .days { font-size: 13px; margin: 4px 0 10px; }
  .silo .info .days.low { color: var(--color-warning); font-weight: 600; }

  .list-item { padding: 12px 0; border-bottom: 1px solid var(--color-border); display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .list-item:last-child { border-bottom: none; padding-bottom: 0; }
  .list-item .body strong { display: block; font-size: 14px; }
  .list-item .body small { color: var(--color-text-muted); font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-warning { background: var(--color-straw); } .dot-success { background: var(--color-success); }
  .dot-info { background: var(--color-info); } .dot-muted { background: var(--color-border-strong); }
  .insight-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--color-border); }
  .insight-row:last-child { border-bottom: none; padding-bottom: 0; }
  .insight-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--color-accent-soft); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .insight-row strong { display: block; font-size: 14px; }
  .insight-row small { color: var(--color-text-muted); font-size: 13px; }

  /* ---------- Webshop ---------- */
  .search-input { position: relative; margin-bottom: 22px; }
  .search-input input { width: 100%; padding: 14px 18px 14px 46px; border: 1px solid var(--color-border-strong); border-radius: 999px; font-family: inherit; font-size: 15px; background: #fff; }
  .search-input input:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(107,163,42,.22); }
  .search-input .icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); }
  .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .category-tile {
    background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md);
    padding: 22px 18px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .category-tile:hover { border-color: var(--color-accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .category-tile .cat-icon { font-size: 30px; width: 58px; height: 58px; border-radius: 16px; background: var(--color-accent-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .category-tile .cat-name { font-weight: 700; font-size: 16px; color: var(--color-primary); }
  .category-tile .cat-desc { font-size: 13px; color: var(--color-text-muted); line-height: 1.4; }
  .category-tile .cat-count { font-size: 12px; color: var(--color-accent-hover); font-weight: 600; margin-top: 4px; }

  .sidebar { display: flex; flex-direction: column; gap: 16px; }
  .sidebar-card { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 16px 18px; }
  .sidebar-card h3 { font-size: 14px; margin-bottom: 10px; }
  .cat-link { display: block; padding: 8px 10px; margin: 0 -10px; font-size: 14px; color: var(--color-text); border-radius: 8px; cursor: pointer; }
  .cat-link:hover { background: var(--color-bg); text-decoration: none; }
  .cat-link.active { background: var(--color-accent-soft); color: var(--color-primary); font-weight: 700; }
  .back-link { display: inline-block; margin-bottom: 14px; font-size: 14px; font-weight: 600; }

  .tag { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--color-bg); color: var(--color-text-muted); margin: 4px 6px 0 0; }

  /* ---------- Article ---------- */
  .article-header { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 26px 30px; margin-bottom: 20px; display: flex; gap: 22px; align-items: center; }
  .article-header .emoji { font-size: 40px; width: 84px; height: 84px; border-radius: 22px; background: var(--color-accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .article-header .product-id { font-size: 13px; color: var(--color-text-muted); }
  .article-header h1 { margin: 2px 0 4px; }
  .price-display { background: linear-gradient(135deg, var(--color-accent-soft), #F6FAEE); border: 1px solid #CFE3B1; border-radius: var(--radius-md); padding: 18px 22px; margin: 22px 0; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
  .price-display .label { font-size: 13px; color: var(--color-text-muted); }
  .price-display .price { font-size: 30px; font-weight: 800; color: var(--color-primary); line-height: 1.15; }
  .price-display .sub { font-size: 13px; color: var(--color-text-muted); margin-top: 2px; }
  .price-display .loading { font-size: 15px; font-weight: 500; font-style: italic; color: var(--color-text-muted); }
  .discount-chip { display: inline-block; background: var(--color-accent); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 2px 10px; margin-left: 8px; vertical-align: middle; }
  .spark { text-align: right; font-size: 12px; color: var(--color-text-muted); }
  .button-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

  /* ---------- Cart ---------- */
  .cart-item { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 18px 22px; margin-bottom: 14px; }
  .cart-item .item-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--color-border); color: var(--color-primary); }
  .item-details { display: grid; grid-template-columns: 1.1fr 1.2fr 1.2fr auto; gap: 18px; }
  .item-details .label { font-size: 12px; color: var(--color-text-muted); }
  .item-details .value { font-size: 14px; font-weight: 600; }
  .remove-btn { background: transparent; border: none; color: var(--color-text-muted); cursor: pointer; padding: 4px; }
  .remove-btn:hover { color: var(--color-danger); }
  .cart-summary { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 22px 26px; margin-top: 20px; }
  .summary-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 15px; }
  .summary-row.total { border-top: 2px solid var(--color-accent); padding-top: 14px; margin-top: 8px; font-size: 19px; font-weight: 800; color: var(--color-primary); }

  /* ---------- Confirmation, empty ---------- */
  .confirmation { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 56px 44px; text-align: center; max-width: 620px; margin: 30px auto; box-shadow: var(--shadow-md); }

function fmtEur(n, d) { d = d === undefined ? 2 : d; return '€ ' + n.toLocaleString(L().locale, { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtNum(n, d) { return n.toLocaleString(L().locale, { minimumFractionDigits: 0, maximumFractionDigits: d || 0 }); }
function seed(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return (h % 1000) / 1000; }
function isoWeek(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil(((x - y0) / 86400000 + 1) / 7);
}
function daysFromNow(n) { const d = new Date(); d.setDate(d.getDate() + n); return d; }
function fmtDate(d) { return d.toLocaleDateString(L().locale, { day: '2-digit', month: '2-digit', year: 'numeric' }); }

/* Pricing logic (in production: Power Pages -> Dataverse virtual table -> F&O price discovery) */
function priceFor(p, formKey, qty) {
  const f = CONFIG.forms[formKey];
  const perTon = p.priceMin + (p.priceMax - p.priceMin) * seed(p.id);
  const kg = f.kg * qty;
  const discount = kg >= 20000 ? 0.025 : (kg >= 10000 ? 0.01 : 0);
  return { unit: (perTon * f.kg / 1000 + f.sur) * (1 - discount), perTon: perTon * (1 - discount), discount };
}

/* Delivery terms are stored language-neutral: 'route' | 'week:N' | 'date' */
function termOptions() {
  const wk = isoWeek(new Date()), o = [{ v: 'route', l: t('term_route') }];
  for (let i = 1; i <= 3; i++) { const n = ((wk + i - 1) % 52) + 1; o.push({ v: 'week:' + n, l: t('term_week', { n }) }); }
  o.push({ v: 'date', l: t('term_date') });
  return o;
}
function termLabel(v, short) {
  if (v === 'route') return t(short ? 'term_route_short' : 'term_route');
  if (v === 'date')  return t(short ? 'term_date_short' : 'term_date');
  return t('term_week', { n: v.split(':')[1] });
}

  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', t(el.dataset.i18nTitle)); });
  document.querySelectorAll('.lang-select').forEach(s => {
    if (!s.options.length) s.innerHTML = Object.keys(LANGS).map(k => `<option value="${k}">${LANGS[k].name}</option>`).join('');
    s.value = lang;
  });
  renderTrace();
  if (state.loggedIn) fillUser();
}

function setLang(l) {
  if (!LANGS[l]) return;
  lang = l;
  try { localStorage.setItem('dh_lang', l); } catch (e) {}
  applyI18n();
  rerender();
}

function rerender() {
  const p = state.currentPage;
  if (p === 'landing' || p === 'login') return;
  updateBreadcrumb(p);
  if (p === 'dashboard') renderDashboard();
  if (p === 'webshop') renderWebshop();
  if (p === 'category') renderCategory();
  if (p === 'article') {   // keep the user's selections when switching language
    const keep = ['order-form','order-qty','order-location','order-silo','order-term','order-note'].map(id => document.getElementById(id).value);
    renderArticle();
    ['order-form','order-qty','order-location','order-silo','order-term','order-note'].forEach((id, i) => {
      const el = document.getElementById(id);
      if (id === 'order-location') { el.value = keep[i]; renderSiloOptions(); }
      else el.value = keep[i];
    });
    fetchPrice();
  }
  if (p === 'cart') renderCart();
  if (p === 'orders') renderOrders();
}

/* ================================================================
   NAVIGATION
   ================================================================ */
function navigate(page, param) {
  document.querySelectorAll('.page-public, .page-app').forEach(p => p.classList.add('hidden'));
  const isPublic = (page === 'landing' || page === 'login');
  document.getElementById('app').classList.toggle('hidden', isPublic);
  document.getElementById('trace-toggle').classList.toggle('hidden', isPublic);
  if (isPublic) document.getElementById('trace-panel').classList.add('hidden');

  if (page === 'landing') { document.getElementById('page-landing').classList.remove('hidden'); renderHeroSilos(); }
  else if (page === 'login') document.getElementById('page-login').classList.remove('hidden');
  else {
    document.getElementById('page-' + page).classList.remove('hidden');
    setActiveNav(page);
    updateBreadcrumb(page, param);
  }

  if (page === 'dashboard') renderDashboard();
  if (page === 'webshop')   renderWebshop();
  if (page === 'category')  { state.currentCategory = param || state.currentCategory; renderCategory(); }
  if (page === 'article')   { state.currentArticle = param || state.currentArticle; renderArticle(); }
  if (page === 'cart')      renderCart();
  if (page === 'orders')    renderOrders();

  state.currentPage = page;
  window.scrollTo(0, 0);
}

function setActiveNav(page) {
  ['dashboard','webshop','orders'].forEach(p => document.getElementById('nav-' + p).classList.remove('active'));
  let key = page;
  if (['category','article','cart','confirmation'].includes(page)) key = 'webshop';
  const el = document.getElementById('nav-' + key);
  if (el) el.classList.add('active');
}

function updateBreadcrumb(page, param) {
  const bc = document.getElementById('breadcrumb');
  const home = `<a onclick="navigate('dashboard')">${t('bc_home')}</a>`;
  const shop = `<a onclick="navigate('webshop')">${t('bc_shop')}</a>`;
  const sep = '<span>›</span>';
  let html = '';
  if (page === 'webshop') html = home + sep + t('bc_shop');
  else if (page === 'category') html = home + sep + shop + sep + cn(param || state.currentCategory);
  else if (page === 'article') {
    const prod = productById(param || state.currentArticle);
    html = home + sep + shop + sep + `<a onclick="navigate('category','${prod.cat}')">${cn(prod.cat)}</a>` + sep + pn(prod.id);
  }
  else if (page === 'cart') html = home + sep + shop + sep + t('bc_cart');
  else if (page === 'orders') html = home + sep + t('bc_orders');
  else if (page === 'confirmation') html = home + sep + t('bc_confirm');
  bc.innerHTML = html;
  bc.classList.toggle('hidden', !html);
}

/* ================================================================
   LOGIN
   ================================================================ */
function fillUser() {
  const c = CONFIG.customer;
  document.getElementById('user-name').textContent = c.name;
  document.getElementById('user-account').textContent = c.company;
  document.getElementById('am-initials').textContent = c.am.initials;
  document.getElementById('am-name').textContent = c.am.name;
  document.getElementById('am-role').textContent = t('adv_role');
  document.getElementById('am-phone').textContent = c.am.phone;
  document.getElementById('am-email').textContent = c.am.email;
  document.getElementById('cust-company').textContent = c.company;
  document.getElementById('cust-address').textContent = c.address;
  document.getElementById('cust-id').textContent = c.accountId;
  document.getElementById('cust-ubn').textContent = c.ubn;
}
function login() {
  state.loggedIn = true;
  fillUser();
  trace('<b>POST</b> /_services/auth → Entra External ID, contact linked to account ' + CONFIG.customer.accountId);
  navigate('dashboard');
}
function logout() { if (confirm(t('confirm_logout'))) { state.loggedIn = false; state.cart = []; updateCartBadge(); navigate('landing'); } }

/* ================================================================
   LANDING: decorative silos
   ================================================================ */
function renderHeroSilos() {
  const el = document.getElementById('hero-silos');
  if (el.dataset.done) return;
  el.dataset.done = '1';
  el.innerHTML = CONFIG.silos.map(s => `<div class="hero-silo"><div class="tube ${s.level < 0.25 ? 'low' : ''}" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);"><div class="fill" style="height:0" data-h="${Math.round(s.level * 100)}"></div><div class="ticks"></div></div>Silo ${s.n}</div>`).join('');
  el.querySelectorAll('.fill').forEach(f => requestAnimationFrame(() => requestAnimationFrame(() => f.style.height = f.dataset.h + '%')));
}

/* ================================================================
   DASHBOARD
   ================================================================ */
function renderDashboard() {
  const c = CONFIG.customer;
  document.getElementById('dash-greeting').textContent = t('greeting', { name: c.firstName });
  const next = daysFromNow(3);
  document.getElementById('next-delivery-title').textContent = t('next_title', { date: next.toLocaleDateString(L().locale, { weekday: 'long', day: 'numeric', month: 'long' }) });
  document.getElementById('next-delivery-sub').textContent = t('next_sub', { product: pn('2001001') });

  const kpis = [
    { label: t('kpi_open'),   value: "3",             sub: t('kpi_open_sub') },
    { label: t('kpi_30'),     value: t('kpi_30_val'), sub: t('kpi_30_sub') },
    { label: t('kpi_month'),  value: fmtEur(18140, 0), sub: t('kpi_month_sub') },
    { label: t('kpi_credit'), value: fmtEur(51550, 0), sub: t('kpi_credit_sub', { limit: fmtEur(75000, 0) }) }
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(k => `<div class="kpi-card"><div class="label">${k.label}</div><div class="value">${k.value}</div><div class="sub">${k.sub}</div></div>`).join('');

  document.getElementById('silo-panel').innerHTML = CONFIG.silos.map(s => {
    const tons = s.level * s.cap, days = Math.floor(tons / s.usage), low = s.level < 0.25;
    return `<div class="silo">
      <div class="tube ${low ? 'low' : ''}"><div class="fill" style="height:${Math.round(s.level * 100)}%"></div><div class="ticks"></div></div>
      <div class="info">
        <strong>Silo ${s.n}</strong><div class="prod">${pn(s.productId)}</div>
        <div class="pct">${Math.round(s.level * 100)}%</div>
        <div class="days ${low ? 'low' : 'text-muted'}">${t('silo_of', { tons: fmtNum(tons, 1), cap: s.cap, days })}</div>
        <button class="btn ${low ? 'btn-accent' : 'btn-secondary'} btn-sm" onclick="navigate('article','${s.productId}')">${t('reorder')}</button>
      </div></div>`;
  }).join('');

  const row = (a, b, dot) => `<div class="list-item"><div class="body"><strong>${a}</strong><small>${b}</small></div><div class="dot dot-${dot}"></div></div>`;
  document.getElementById('dashboard-open-orders').innerHTML = CONFIG.openOrders.map(o => row(pn(o.pid), t(o.key), o.dot)).join('');
  document.getElementById('dashboard-notifications').innerHTML = CONFIG.notifications.map(n => row(t(n.k + '_t'), t(n.k + '_s'), n.dot)).join('');
  document.getElementById('dashboard-insights').innerHTML = CONFIG.insights.map(i => `<div class="insight-row"><div class="insight-icon">${i.icon}</div><div><strong>${t(i.k + '_t')}</strong><small>${t(i.k + '_s')}</small></div></div>`).join('');
}

function repeatLastOrder() {
  const p = productById("2001001");
  state.cart.push({ productId: p.id, formKey: 'bulk', qty: 12, locIdx: 0, siloIdx: 0, term: 'route', note: '', unitPrice: priceFor(p, 'bulk', 12).unit });
  trace('<b>GET</b> /_api/salesorders?$top=1 → last order copied to cart');
  updateCartBadge();
  navigate('cart');
}

/* ================================================================
   WEBSHOP & CATEGORY
   ================================================================ */
function renderWebshop() {
  document.getElementById('webshop-search').value = '';
  renderSearchResults();
  document.getElementById('category-grid').innerHTML = CONFIG.categoryIds.map(id => {
    const n = CONFIG.products.filter(p => p.cat === id).length;
    return `<div class="category-tile" tabindex="0" onclick="navigate('category','${id}')" onkeydown="if(event.key==='Enter')navigate('category','${id}')">
      <div class="cat-icon">${catEmoji(id)}</div><div class="cat-name">${cn(id)}</div><div class="cat-desc">${cd(id)}</div><div class="cat-count">${t('n_products', { n })}</div></div>`;
  }).join('');

  document.getElementById('sidebar-favs').innerHTML = state.favs.length
    ? state.favs.map(id => { const p = productById(id); return `<a class="cat-link" onclick="navigate('article','${id}')">${catEmoji(p.cat)} ${pn(id)}</a>`; }).join('')
    : `<div class="text-muted" style="font-size:14px;">${t('no_favs')}</div>`;

  document.getElementById('sidebar-open-orders').innerHTML = CONFIG.openOrders.map(o =>
    `<div style="padding:7px 0;border-bottom:1px solid var(--color-border);font-size:13px;"><strong>${pn(o.pid)}</strong><br><span class="text-muted">${t(o.key)}</span></div>`).join('');
}

function renderSearchResults() {
  const q = document.getElementById('webshop-search').value.trim().toLowerCase();
  const box = document.getElementById('search-results'), grid = document.getElementById('category-grid');
  if (!q) { box.classList.add('hidden'); grid.classList.remove('hidden'); return; }
  const hits = CONFIG.products.filter(p => pn(p.id).toLowerCase().includes(q) || p.id.includes(q) || ps(p.id).toLowerCase().includes(q));
  grid.classList.add('hidden'); box.classList.remove('hidden');
  box.innerHTML = hits.length
    ? '<div class="card" style="padding:0;overflow:hidden;"><table class="data-table"><tbody>' + hits.map(productRow).join('') + '</tbody></table></div>'
    : '<div class="empty-state">' + t('no_results', { q: q.replace(/</g, '&lt;') }) + '</div>';
}

function renderCategory() {
  const id = state.currentCategory;
  if (!id) return;
  document.getElementById('category-title').textContent = cn(id);
  document.getElementById('category-desc').textContent = cd(id);
  document.getElementById('category-search').value = '';
  document.getElementById('category-list-sidebar').innerHTML = CONFIG.categoryIds.map(c =>
    `<a class="cat-link ${c === id ? 'active' : ''}" onclick="navigate('category','${c}')">${catEmoji(c)} ${cn(c)}</a>`).join('');
  renderCategoryProducts();
}

function productRow(p) {
  return `<tr>
    <td><strong>${pn(p.id)}</strong><br><small class="text-muted">${ps(p.id)}</small></td>
    <td><span class="text-muted">${p.id}</span></td>
    <td>${p.forms.map(k => `<span class="tag">${t('form_' + k + '_s')}</span>`).join('')}</td>
    <td class="text-right"><button class="btn btn-primary btn-sm" onclick="navigate('article','${p.id}')">${t('btn_order')}</button></td></tr>`;
}

function renderCategoryProducts() {
  const q = (document.getElementById('category-search').value || '').toLowerCase();
  const list = CONFIG.products.filter(p => p.cat === state.currentCategory && (!q || pn(p.id).toLowerCase().includes(q) || p.id.includes(q)));
  document.getElementById('category-products').innerHTML = list.length ? list.map(productRow).join('')
    : `<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--color-text-muted);">${t('no_feed')}</td></tr>`;
}

/* ================================================================
   ARTICLE / ORDER FORM
   ================================================================ */
function renderArticle() {
  const p = productById(state.currentArticle);
  if (!p) return;
  document.getElementById('article-emoji').textContent = catEmoji(p.cat);
  document.getElementById('article-id').textContent = t('article_no', { id: p.id });
  document.getElementById('article-name').textContent = pn(p.id);
  document.getElementById('article-meta').textContent = ps(p.id);
  document.getElementById('article-tags').innerHTML = ['tag_contract', 'tag_daily'].map(k => `<span class="tag">${t(k)}</span>`).join('');

  document.getElementById('article-facts').innerHTML = `
    <dt>${t('lbl_customer')}</dt><dd>${CONFIG.customer.company} (${CONFIG.customer.accountId})</dd>
    <dt>${t('lbl_ubn')}</dt><dd>${CONFIG.customer.ubn}</dd>
    <dt>${t('lbl_avail')}</dt><dd>${p.forms.map(k => t('form_' + k + '_l')).join(', ')}</dd>`;

  document.getElementById('order-form').innerHTML = p.forms.map(k => `<option value="${k}">${t('form_' + k + '_l')}</option>`).join('');
  document.getElementById('order-location').innerHTML = CONFIG.customer.locations.map((l, i) => `<option value="${i}">${locLabel(i)}</option>`).join('');
  document.getElementById('order-term').innerHTML = termOptions().map(o => `<option value="${o.v}">${o.l}</option>`).join('');
  document.getElementById('order-note').value = '';
  document.getElementById('fav-btn').textContent = state.favs.includes(p.id) ? t('fav_on') : t('fav_off');

  renderSiloOptions();
  onFormChange();
}

function renderSiloOptions() {
  const i = +document.getElementById('order-location').value || 0;
  const n = CONFIG.customer.locations[i].silos;
  document.getElementById('order-silo').innerHTML = Array.from({ length: n }, (_, j) => `<option value="${j}">${siloLabel(i, j)}</option>`).join('');
}

function onFormChange() {
  const f = CONFIG.forms[document.getElementById('order-form').value];
  document.getElementById('silo-group').classList.toggle('hidden', !f.silo);
  document.getElementById('price-label').textContent = t('price_label', { unit: unitName(f.unitKey, 1) });
  const q = document.getElementById('order-qty');
  q.min = f.min; q.step = f.step; q.value = f.min;
  fetchPrice();
}

function stepQty(dir) {
  const f = CONFIG.forms[document.getElementById('order-form').value];
  const q = document.getElementById('order-qty');
  q.value = Math.max(f.min, (parseFloat(q.value) || f.min) + dir * f.step);
  fetchPrice();
}

function fetchPrice(manual) {
  const p = productById(state.currentArticle);
  if (!p) return;
  const formKey = document.getElementById('order-form').value, f = CONFIG.forms[formKey];
  document.getElementById('price-label').textContent = t('price_label', { unit: unitName(f.unitKey, 1) });
  const qty = Math.max(f.min, parseInt(document.getElementById('order-qty').value) || f.min);
  const kg = qty * f.kg;
  document.getElementById('qty-hint').textContent = t('qty_hint', { qty, unitQty: unitName(f.unitKey, qty), tons: fmtNum(kg / 1000, 2), min: f.min, unitMin: unitName(f.unitKey, f.min) });

  const priceEl = document.getElementById('article-price');
  priceEl.innerHTML = '<span class="loading">' + t('price_loading') + '</span>';
  document.getElementById('article-price-sub').textContent = '';
  const t0 = performance.now();
  setTimeout(() => {
    const r = priceFor(p, formKey, qty);
    state.currentPrice = r.unit;
    priceEl.innerHTML = fmtEur(r.unit) + (r.discount ? `<span class="discount-chip">${t('discount_chip', { x: fmtNum(r.discount * 100, 1) })}</span>` : '');
    document.getElementById('article-price-sub').innerHTML = t('total_line', { total: fmtEur(r.unit * qty), perTon: fmtEur(r.perTon) });
    renderSpark(p, r.perTon);
    trace(`<b>GET</b> /_api/dh_dailyprice?item=${p.id}&amp;qty=${qty}&amp;form=${formKey} → ${fmtEur(r.unit)} (${Math.round(performance.now() - t0)} ms, F&amp;O price discovery)`);
  }, manual ? 700 : 350);
}

function renderSpark(p, perTon) {
  const pts = [];
  for (let i = 0; i < 8; i++) pts.push(perTon * (1 + (seed(p.id + i) - 0.5) * 0.05 - (7 - i) * 0.002));
  pts[7] = perTon;
  const min = Math.min(...pts), max = Math.max(...pts);
  const xy = pts.map((v, i) => `${(i * 120 / 7).toFixed(1)},${(34 - (v - min) / ((max - min) || 1) * 28).toFixed(1)}`).join(' ');
  const diff = (perTon - pts[0]) / pts[0] * 100;
  document.getElementById('article-spark').innerHTML = `
    <svg width="130" height="40" viewBox="-4 0 128 40"><polyline fill="none" stroke="#6BA32A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${xy}"/></svg>
    <div>${t('spark', { sign: diff >= 0 ? '+' : '−', x: fmtNum(Math.abs(diff), 1) })}</div>`;
}

function toggleFav() {
  const id = state.currentArticle, i = state.favs.indexOf(id);
  if (i >= 0) state.favs.splice(i, 1); else state.favs.push(id);
  document.getElementById('fav-btn').textContent = state.favs.includes(id) ? t('fav_on') : t('fav_off');
}

/* ================================================================
   CART
   ================================================================ */
function addToCart(btn) {
  const p = productById(state.currentArticle);
  if (!p) return;
  const formKey = document.getElementById('order-form').value, f = CONFIG.forms[formKey];
  const qty = Math.max(f.min, parseInt(document.getElementById('order-qty').value) || f.min);
  state.cart.push({
    productId: p.id, formKey, qty,
    locIdx: +document.getElementById('order-location').value || 0,
    siloIdx: f.silo ? (+document.getElementById('order-silo').value || 0) : null,
    term: document.getElementById('order-term').value,
    note: document.getElementById('order-note').value,
    unitPrice: state.currentPrice || priceFor(p, formKey, qty).unit
  });
  updateCartBadge();
  trace(`<b>POST</b> /_api/dh_cartlines → line added (${qty} × ${formKey}, item ${p.id})`);
  btn.textContent = t('added'); btn.disabled = true;
  setTimeout(() => { btn.textContent = t('btn_add'); btn.disabled = false; navigate('cart'); }, 600);
}

function removeFromCart(i) { state.cart.splice(i, 1); updateCartBadge(); renderCart(); }

function renderCart() {
  const wrap = document.getElementById('cart-items'), bottom = document.getElementById('cart-bottom'), empty = document.getElementById('cart-empty');
  if (!state.cart.length) { wrap.innerHTML = ''; bottom.classList.add('hidden'); empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden'); bottom.classList.remove('hidden');

  wrap.innerHTML = state.cart.map((it, i) => {
    const f = CONFIG.forms[it.formKey], p = productById(it.productId);
    return `
    <div class="cart-item">
      <div class="item-header">
        <span>${catEmoji(p.cat)} ${pn(p.id)} <span class="text-muted" style="font-weight:400;">(${p.id})</span></span>
        <button class="remove-btn" onclick="removeFromCart(${i})" title="${t('remove')}" aria-label="${t('remove')}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
      <div class="item-details">
        <div><div class="label">${t('lbl_qty')}</div><div class="value">${it.qty} ${unitName(f.unitKey, it.qty)}</div><small class="text-muted">${t('form_' + it.formKey + '_l')}</small></div>
        <div><div class="label">${t('lbl_location')}</div><div class="value">${locLabel(it.locIdx)}</div>${it.siloIdx !== null ? `<small class="text-muted">${siloLabel(it.locIdx, it.siloIdx)}</small>` : ''}</div>
        <div><div class="label">${t('lbl_week')}</div><div class="value">${termLabel(it.term)}</div></div>
        <div class="text-right"><div class="label">${t('lbl_subtotal')}</div><div class="value" style="color:var(--color-primary);">${fmtEur(it.qty * it.unitPrice)}</div></div>
      </div>
      ${it.note ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--color-border);font-size:13px;"><strong>${t('note_inline')}</strong> <span class="text-muted">${it.note.replace(/</g, '&lt;')}</span></div>` : ''}
    </div>`;
  }).join('');

  const sub = state.cart.reduce((s, i) => s + i.qty * i.unitPrice, 0);
  const kg = state.cart.reduce((s, i) => s + i.qty * CONFIG.forms[i.formKey].kg, 0);
  document.getElementById('summary-lines').textContent = state.cart.length;
  document.getElementById('summary-weight').textContent = fmtNum(kg / 1000, 1) + ' t';
  document.getElementById('summary-subtotal').textContent = fmtEur(sub);
  document.getElementById('summary-vat-label').textContent = t('sum_vat', { p: Math.round(CONFIG.vatRate * 100) });
  document.getElementById('summary-vat').textContent = fmtEur(sub * CONFIG.vatRate);
  document.getElementById('summary-total').textContent = fmtEur(sub * (1 + CONFIG.vatRate));
}

function updateCartBadge() {
  const b = document.getElementById('cart-badge');
  b.textContent = state.cart.length;
  b.classList.toggle('hidden', !state.cart.length);
}

function placeOrder() {
  if (!state.cart.length) return;
  state.orderCounter++;
  const orderNum = 'SO-2026-0' + state.orderCounter;
  const sub = state.cart.reduce((s, i) => s + i.qty * i.unitPrice, 0);
  const kg = state.cart.reduce((s, i) => s + i.qty * CONFIG.forms[i.formKey].kg, 0);
  CONFIG.orders.unshift({ id: orderNum, ago: 0, lines: state.cart.length, kg, deliveryTerm: state.cart[0].term, total: sub * (1 + CONFIG.vatRate), statusKey: "st_sent", statusType: "info" });
  trace(`<b>POST</b> /_api/dh_placeorder → Power Automate → F&amp;O SalesOrderHeaderV2 ${orderNum} (${state.cart.length} lines)`);
  document.getElementById('confirm-order-num').textContent = orderNum;
  state.cart = []; updateCartBadge();
  navigate('confirmation');
}

/* ================================================================
   ORDERS
   ================================================================ */
function renderOrders() {
  document.getElementById('orders-table-body').innerHTML = CONFIG.orders.map(o => `
    <tr>
      <td><strong style="color:var(--color-primary);">${o.id}</strong></td>
      <td>${fmtDate(daysFromNow(-o.ago))}</td>
      <td>${o.lines}</td>
      <td>${fmtNum(o.kg / 1000, 1)} t</td>
      <td>${o.deliveryKey ? t(o.deliveryKey) : termLabel(o.deliveryTerm, true)}</td>
      <td>${fmtEur(o.total)}</td>
      <td><span class="badge badge-${o.statusType}">${t(o.statusKey)}</span></td>
      <td class="text-right"><button class="btn btn-secondary btn-sm" onclick="alert(t('alert_details', {id:'${o.id}'}))">${t('btn_details')}</button></td>
    </tr>`).join('');
  trace('<b>GET</b> /_api/salesorders?$filter=account eq ' + CONFIG.customer.accountId + ' → ' + CONFIG.orders.length + ' orders (virtual table)');
}

/* ================================================================
   INIT
   ================================================================ */
applyI18n();
